<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 230" role="img" aria-labelledby="t">
  <title id="t">Velocity Spur Hotshot Ltd.</title>
  <defs>
    <linearGradient id="fire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB15C"/>
      <stop offset=".45" stop-color="#FF7900"/>
      <stop offset="1" stop-color="#D93B0B"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".48" stop-color="#E4E6E9"/>
      <stop offset=".58" stop-color="#8E9299"/>
      <stop offset="1" stop-color="#F2F3F4"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B2F38"/>
      <stop offset="1" stop-color="#0B0B0D"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1607"/>
      <stop offset="1" stop-color="#FF7900"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="160" cy="88" r="74"/></clipPath>
  </defs>

  <!-- emblem disc -->
  <circle cx="160" cy="88" r="80" fill="url(#metal)"/>
  <circle cx="160" cy="88" r="76" fill="url(#badge)"/>
  <g clip-path="url(#disc)">
    <rect x="80" y="10" width="160" height="110" fill="url(#sky)" opacity=".85"/>
    <!-- mountains -->
    <path d="M78 104 L122 52 L140 72 L166 36 L198 76 L214 60 L244 104 Z" fill="#14161b"/>
    <path d="M166 36 L156 50 L163 48 L170 56 L176 46 Z M122 52 L114 62 L121 60 L126 64 Z" fill="#E4E6E9"/>
    <!-- road -->
    <path d="M80 118 L240 104 L240 170 L80 170 Z" fill="#0B0B0D"/>
    <!-- truck + trailer silhouette -->
    <g fill="#0B0B0D" stroke="#FF7900" stroke-width="1.6" stroke-linejoin="round">
      <path d="M100 112 L104 96 L118 92 L126 80 L150 80 L154 96 L162 98 L162 112 Z"/>
      <path d="M160 102 L232 98 L232 110 L160 113 Z"/>
    </g>
    <path d="M128 83 L148 83 L150 94 L124 94 Z" fill="#FF7900" opacity=".55"/>
    <g fill="#0B0B0D" stroke="#C4C7CB" stroke-width="2">
      <circle cx="114" cy="114" r="7"/><circle cx="148" cy="114" r="7"/>
      <circle cx="206" cy="112" r="6"/><circle cx="220" cy="112" r="6"/>
    </g>
    <rect x="100" y="104" width="6" height="3" fill="#FFD27A"/>
  </g>

  <!-- speed swoosh -->
  <path d="M60 52 C110 2, 230 0, 276 40 C232 16, 132 16, 78 64 Z" fill="url(#fire)"/>

  <!-- wordmark plate -->
  <path d="M28 132 L292 132 L276 176 L44 176 Z" fill="#0B0B0D" stroke="url(#metal)" stroke-width="3"/>
  <text x="160" y="168" text-anchor="middle" font-family="'Arial Black','Barlow Condensed',Impact,sans-serif" font-size="40" font-style="italic" font-weight="900" fill="url(#metal)" stroke="#0B0B0D" stroke-width="1" letter-spacing="1">VELOCITY</text>

  <path d="M96 178 L224 178 L214 206 L106 206 Z" fill="#0B0B0D" stroke="#FF7900" stroke-width="2"/>
  <text x="160" y="201" text-anchor="middle" font-family="'Arial Black','Barlow Condensed',Impact,sans-serif" font-size="26" font-style="italic" font-weight="900" fill="url(#fire)" letter-spacing="2">SPUR</text>

  <rect x="122" y="208" width="76" height="16" rx="3" fill="#C4C7CB"/>
  <text x="160" y="220.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="800" fill="#0B0B0D" letter-spacing="3">HOTSHOT</text>
</svg>
